services:
  postgres:
    image: postgres:17-alpine
    container_name: tripplanner-postgres
    environment:
      POSTGRES_USER: tripplanner
      POSTGRES_PASSWORD: tripplanner
      POSTGRES_DB: tripplanner
    ports:
      - "5434:5432"
    volumes:
      - tripplanner-pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripplanner -d tripplanner"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  tripplanner-pgdata:
